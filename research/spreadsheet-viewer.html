<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Supplier Spreadsheet Row View</title>
<style>
:root{color-scheme:dark;--bg:#0d0d0d;--surface:#161616;--surface2:#1c1c1c;--border:rgba(255,255,255,.12);--text:#f0ede8;--muted:#8f8980;--muted2:#b7b0a6;--accent:#d4af72;--blue:#5b9bd5;--green:#4caf7a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:28px 18px 42px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{font-size:26px;line-height:1.15;margin:8px 0 8px;font-weight:650}
.sub{color:var(--muted2);line-height:1.55;max-width:820px;font-size:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 22px}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
.btn{display:inline-flex;align-items:center;border:.5px solid var(--border);border-radius:6px;padding:8px 11px;background:var(--surface2);font-size:12px;color:var(--text)}
.panel{background:var(--surface);border:.5px solid var(--border);border-radius:10px;overflow:hidden}
.status{padding:18px;color:var(--muted2)}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:9px 10px;border-bottom:.5px solid var(--border);vertical-align:top;text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:#202020;color:var(--muted2);font-size:10px;letter-spacing:.08em;text-transform:uppercase;z-index:1}
td{color:var(--text)}
tr.hit td{background:rgba(212,175,114,.13)}
tr:hover td{background:rgba(255,255,255,.035)}
.muted{color:var(--muted)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.scroll{overflow:auto;max-height:72vh}
.pill{display:inline-flex;border:.5px solid rgba(212,175,114,.35);background:rgba(212,175,114,.1);color:var(--accent);border-radius:999px;padding:2px 7px;font-size:11px}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Supplier Source</div>
  <h1 id="title">Spreadsheet Row View</h1>
  <div class="sub" id="summary">Loading source rows...</div>
  <div class="actions" id="actions"></div>
  <div class="panel">
    <div class="status" id="status">Loading...</div>
    <div class="scroll" id="table-wrap" style="display:none">
      <table>
        <thead>
          <tr>
            <th>Row</th><th>IGI</th><th>Shape</th><th>Carat</th><th>Color</th><th>Clarity</th>
            <th>Cut</th><th>Pol</th><th>Sym</th><th>Growth</th><th>Measurements</th><th>Price</th><th>$/ct</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</div>
<script>
const SOURCES = {
  'messi-gems': {
    label: 'Wuzhou Messi Gems IGI Lab Grown Diamond List',
    index: 'data/messi-gems-index.json',
    xlsx: 'data/IGI Lab Grown Diamond List.2026.05.18xls.xlsx',
  },
  'starsgem': {
    label: 'Wuzhou StarGem Diamond Stock',
    index: 'data/starsgem-index.json',
    xlsx: 'data/STARS Diamonds Stock2026.5.20.xls',
  },
  'messi-color': {
    label: 'Wuzhou Messi Gems Fancy Color List',
    index: 'data/messi-color-index.json',
    xlsx: 'data/2026.05.11MESSIGEMS COLORS LAB DIAMONDS LIST.xlsx',
  },
};
const IGI_PDF_BASE = 'https://pdf.igi.org/';
const params = new URLSearchParams(location.search);
const sourceKey = params.get('source') || 'messi-gems';
const wantedRows = new Set((params.get('rows') || '').split(',').map(s => s.trim()).filter(Boolean));
const wantedReports = new Set((params.get('reports') || '').split(',').map(s => s.trim()).filter(Boolean));
  const source = SOURCES[sourceKey] || SOURCES['messi-gems'];

function esc(v){return String(v ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function money(v){return Number.isFinite(Number(v)) ? '$' + Math.round(Number(v)).toLocaleString() : '';}
function num(v,d=2){return Number.isFinite(Number(v)) ? Number(v).toFixed(d).replace(/\.?0+$/,'') : '';}
function igiPdfSlug(v){
  const clean = String(v || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (/^(ID|FRD|FDR)\d{6,}$/.test(clean)) return clean;
  const digits = (clean.match(/\d{6,}/) || [''])[0];
  if (!digits) return clean;
  return 'FDR' + digits;
}
function reportUrl(v){return IGI_PDF_BASE + encodeURIComponent(igiPdfSlug(v)) + '.pdf';}
function isHit(r){
  const rowNo = String(r.rowNo ?? '').trim();
  const report = String(r.reportNo ?? '').trim();
  return (rowNo && wantedRows.has(rowNo)) || (report && wantedReports.has(report));
}
function rowHtml(r){
  const report = String(r.reportNo ?? '').trim();
  const measure = [r.size1,r.size2,r.size3].map(v=>num(v)).filter(Boolean).join(' x ') || esc(r.measurement || '');
  const price = r.pricePerStone ?? r.priceUsd;
  const ppc = r.pricePerCarat ?? (price && r.carat ? price / r.carat : null);
  return `<tr class="${isHit(r) ? 'hit' : ''}">
    <td class="mono">${esc(r.rowNo ?? '')}</td>
    <td class="mono">${report ? `<a href="${esc(reportUrl(report))}" target="_blank" rel="noopener">${esc(report)}</a>` : ''}</td>
    <td>${esc(r.shape || '')}</td>
    <td class="mono">${num(r.carat)}</td>
    <td>${esc(r.color || r.colorNormalized || '')}</td>
    <td class="mono">${esc(r.clarity || '')}</td>
    <td class="mono">${esc(r.cut || r.cutStyle || '')}</td>
    <td class="mono">${esc(r.polish || '')}</td>
    <td class="mono">${esc(r.symmetry || '')}</td>
    <td class="mono">${esc(r.growthMethod || '')}</td>
    <td class="mono">${measure}</td>
    <td class="mono">${money(price)}</td>
    <td class="mono">${money(ppc)}</td>
  </tr>`;
}

async function main(){
  document.getElementById('title').textContent = source.label;
  document.getElementById('actions').innerHTML =
    `<a class="btn" href="${esc(source.xlsx)}" target="_blank" rel="noopener">Open spreadsheet file</a>` +
    `<a class="btn" href="${esc(source.index)}" target="_blank" rel="noopener">Open JSON index</a>`;
  if (location.protocol === 'file:') {
    document.getElementById('status').innerHTML =
      'This row viewer needs to be opened from the app or a local web server so it can load the JSON index. Use the spreadsheet file link above for direct file access.';
    return;
  }
  const res = await fetch(source.index);
  if (!res.ok) throw new Error('Could not load ' + source.index);
  const data = await res.json();
  const records = data.records || [];
  const hits = records.filter(isHit);
  const shown = hits.length ? hits : records.slice(0, 250);
  const requested = [...wantedRows].map(r => 'row ' + r).concat([...wantedReports].map(r => 'IGI ' + r)).join(', ');
  document.getElementById('summary').innerHTML = hits.length
    ? `<span class="pill">${hits.length} highlighted</span> ${esc(requested)}`
    : `No exact highlighted rows found${requested ? ' for ' + esc(requested) : ''}. Showing the first ${shown.length} records.`;
  document.getElementById('rows').innerHTML = shown.map(rowHtml).join('');
  document.getElementById('status').style.display = 'none';
  document.getElementById('table-wrap').style.display = '';
}

main().catch(err => {
  document.getElementById('status').textContent = `${err.message}. If this was opened directly from disk, use the app/local server or open the spreadsheet file above.`;
});
</script>
</body>
</html>
